<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>AI Chat API Test</title>
    <style>
        body { font-family: system-ui; max-width: 800px; margin: 50px auto; padding: 20px; }
        #messages { border: 1px solid #ddd; border-radius: 8px; padding: 20px; min-height: 300px; max-height: 500px; overflow-y: auto; margin-bottom: 20px; }
        .user-msg { background: #e3f2fd; padding: 10px; border-radius: 8px; margin: 10px 0; }
        .bot-msg { background: #f5f5f5; padding: 10px; border-radius: 8px; margin: 10px 0; white-space: pre-wrap; }
        textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 14px; }
        button { padding: 10px 30px; background: #1976d2; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; margin: 10px 5px 0 0; }
        button:hover { background: #1565c0; }
    </style>
</head>
<body>
    <h1>🤖 AI Chat API 测试</h1>
    <div id="messages"></div>
    <textarea id="input" rows="3" placeholder="输入你的问题..."></textarea>
    <div>
        <button onclick="sendMessage()">发送 (普通)</button>
        <button onclick="sendStreamMessage()" style="background:#388e3c">发送 (流式)</button>
    </div>

    <script>
    async function sendMessage() {
        const input = document.getElementById('input');
        const userMsg = input.value.trim();
        if (!userMsg) return;

        addMessage('user', userMsg);
        input.value = '';

        const resp = await fetch('/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                model: 'deepseek',
                messages: [
                    {role: 'system', content: '你是助手，回答简洁'},
                    {role: 'user', content: userMsg}
                ],
                temperature: 0.7,
            })
        });
        const data = await resp.json();
        addMessage('bot', data.content);
    }

    async function sendStreamMessage() {
        const input = document.getElementById('input');
        const userMsg = input.value.trim();
        if (!userMsg) return;

        addMessage('user', userMsg);
        input.value = '';

        // 创建 bot 消息占位
        const msgDiv = addMessage('bot', '');
        let fullText = '';

        const resp = await fetch('/chat/stream', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                model: 'deepseek',
                messages: [
                    {role: 'system', content: '你是助手，回答简洁'},
                    {role: 'user', content: userMsg}
                ],
                temperature: 0.7,
            })
        });

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
            const {done, value} = await reader.read();
            if (done) break;

            const text = decoder.decode(value);
            // 解析 SSE 事件
            const lines = text.split('\n');
            for (const line of lines) {
                if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                    try {
                        const data = JSON.parse(line.slice(6));
                        if (data.token) {
                            fullText += data.token;
                            msgDiv.textContent = fullText;
                        }
                    } catch(e) {}
                }
            }
        }
    }

    function addMessage(role, text) {
        const container = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = role === 'user' ? 'user-msg' : 'bot-msg';
        div.innerHTML = `<strong>${role === 'user' ? '你' : 'AI'}:</strong> ${text}`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        return div;
    }
    </script>
</body>
</html>
